name: Release userscript

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run check

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/bb-powerbrowser.user.js
